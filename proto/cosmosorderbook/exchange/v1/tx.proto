syntax = "proto3";
package cosmosorderbook.exchange.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmosorderbook/exchange/v1/types.proto";

option go_package = "github.com/ayushmishra2005/cosmos-orderbook-engine/x/exchange/types/v1";

// Msg is the exchange transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc Deposit(MsgDeposit) returns (MsgDepositResponse);
  rpc Withdraw(MsgWithdraw) returns (MsgWithdrawResponse);
  rpc PlaceOrder(MsgPlaceOrder) returns (MsgPlaceOrderResponse);
  rpc CancelOrder(MsgCancelOrder) returns (MsgCancelOrderResponse);
}

// MsgDeposit moves bank coins into exchange custody and credits available balance.
message MsgDeposit {
  option (cosmos.msg.v1.signer) = "owner";

  string                   owner  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgDepositResponse {}

// MsgWithdraw debits available balance and returns bank coins to the owner.
message MsgWithdraw {
  option (cosmos.msg.v1.signer) = "owner";

  string                   owner  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgWithdrawResponse {}

// MsgPlaceOrder is a new order. The chain derives the order ID.
message MsgPlaceOrder {
  option (cosmos.msg.v1.signer) = "owner";

  string      owner           = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64      market_id       = 2;
  Side        side            = 3;
  OrderType   order_type      = 4;
  TimeInForce time_in_force   = 5;
  uint64      quantity_lots   = 6;
  uint64      price_ticks     = 7;
  uint64      expiry_height   = 8;
  uint64      command_nonce   = 9;
  bytes       client_order_id = 10;
}

message MsgPlaceOrderResponse {
  bytes  order_id       = 1;
  uint64 remaining_lots = 2;
  bool   rested         = 3;
}

// MsgCancelOrder cancels one live order by ID.
message MsgCancelOrder {
  option (cosmos.msg.v1.signer) = "owner";

  string owner         = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes  order_id      = 2;
  uint64 command_nonce = 3;
}

message MsgCancelOrderResponse {
  bytes  order_id = 1;
  uint64 asset_id = 2;
  uint64 released = 3;
}
