syntax = "proto3";
package cosmosorderbook.exchange.v1;

option go_package = "github.com/ayushmishra2005/cosmos-orderbook-engine/x/exchange/types/v1";

// Side matches the consensus values in pkg/domain.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY         = 1;
  SIDE_SELL        = 2;
}

// OrderType matches the consensus values in pkg/domain.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT       = 1;
  ORDER_TYPE_MARKET      = 2;
}

// TimeInForce matches the consensus values in pkg/domain.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC         = 1;
  TIME_IN_FORCE_IOC         = 2;
  TIME_IN_FORCE_FOK         = 3;
  TIME_IN_FORCE_GTD         = 4;
}

// Asset is a bank denom registered for exchange custody.
message Asset {
  uint64 id    = 1;
  string denom = 2;
}

// Market is one trading pair.
message Market {
  uint64 id                            = 1;
  uint64 base_asset_id                 = 2;
  uint64 quote_asset_id                = 3;
  uint64 base_lot_size                 = 4;
  uint64 quote_atoms_per_tick_per_lot  = 5;
  uint64 maker_fee_ppm                 = 6;
  uint64 taker_fee_ppm                 = 7;
  uint32 max_maker_visits              = 8;
  bool   enabled                       = 9;
  string base_denom                    = 10;
  string quote_denom                   = 11;
}

// Balance is one owner's available and locked atoms for an asset.
message Balance {
  string owner     = 1;
  uint64 asset_id  = 2;
  string denom     = 3;
  uint64 available = 4;
  uint64 locked    = 5;
}

// Order is a live order returned by queries.
message Order {
  bytes       order_id       = 1;
  string      owner          = 2;
  uint64      market_id      = 3;
  Side        side           = 4;
  OrderType   order_type     = 5;
  TimeInForce time_in_force  = 6;
  uint64      price_ticks    = 7;
  uint64      original_lots  = 8;
  uint64      remaining_lots = 9;
  uint64      sequence       = 10;
  uint64      expiry_height  = 11;
  uint64      command_nonce  = 12;
}

// BookOrder is one resting order in canonical book order.
message BookOrder {
  bytes  order_id       = 1;
  Side   side           = 2;
  uint64 price_ticks    = 3;
  uint64 remaining_lots = 4;
  uint64 sequence       = 5;
}

// Trade is one persisted fill.
message Trade {
  uint64 market_id      = 1;
  uint64 sequence       = 2;
  bytes  maker_order_id = 3;
  bytes  taker_order_id = 4;
  uint64 price_ticks    = 5;
  uint64 quantity_lots  = 6;
  uint64 base_amount    = 7;
  uint64 quote_amount   = 8;
  uint64 maker_fee      = 9;
  uint64 taker_fee      = 10;
  string buyer          = 11;
  string seller         = 12;
}
