syntax = "proto3";
package cosmosorderbook.exchange.v1;

import "cosmosorderbook/exchange/v1/types.proto";

option go_package = "github.com/ayushmishra2005/cosmos-orderbook-engine/x/exchange/types/v1";

// GenesisState is the exchange portion of genesis.
// Balances are accepted only when bank custody already covers them.
message GenesisState {
  string instance_id = 1;

  repeated Asset          assets           = 2;
  repeated Market         markets          = 3;
  repeated GenesisBalance balances         = 4;
  repeated AccountNonce   nonces           = 5;
  repeated MarketSequence order_sequences  = 6;
  repeated MarketSequence trade_sequences  = 7;
  uint64                  revision         = 8;
}

// GenesisBalance is an available balance. Locked must be zero.
message GenesisBalance {
  string owner     = 1;
  uint64 asset_id  = 2;
  uint64 available = 3;
  uint64 locked    = 4;
}

message AccountNonce {
  string owner = 1;
  uint64 nonce = 2;
}

message MarketSequence {
  uint64 market_id = 1;
  uint64 sequence  = 2;
}
