syntax = "proto3";
package cosmosorderbook.batch.v1;

import "cosmos_proto/cosmos.proto";
import "cosmosorderbook/batch/v1/types.proto";

option go_package = "github.com/ayushmishra2005/cosmos-orderbook-engine/x/batch/types/v1";

// GenesisState is the batch portion of genesis.
message GenesisState {
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 latest_batch_number = 2;
  repeated Batch batches = 3;
}
